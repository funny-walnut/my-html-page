    <style>
      :root {
        --primary: rgb(145, 85, 253);
        --light-bg: #f5f3ff;
        --dark: #1e1b2e;
        --white: #ffffff;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: var(--light-bg);
        color: var(--dark);
      }

      header {
        background: var(--primary);
        color: var(--white);
        padding: 25px;
        text-align: center;
      }

      header h1 {
        margin: 0;
        font-size: 32px;
        letter-spacing: 1px;
      }

      .container {
        display: flex;
        min-height: 80vh;
      }

      main {
        flex: 3;
        padding: 40px;
      }

      main h2 {
        color: var(--primary);
      }

      .cta-button {
        background: var(--primary);
        color: white;
        padding: 12px 20px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        margin-top: 15px;
        transition: 0.3s;
      }

      .cta-button:hover {
        opacity: 0.85;
      }

      aside {
        flex: 1;
        background: white;
        padding: 30px;
        border-left: 3px solid var(--primary);
        box-shadow: -2px 0 10px rgba(0, 0, 0, 0.05);
      }

      aside h3 {
        color: var(--primary);
      }

      footer {
        text-align: center;
        padding: 15px;
        background: #ede9fe;
        font-size: 14px;
      }

      .hero {
        width: 100%;
        overflow: hidden;
        margin-top: 30px; /* ← отступ от кнопки */
      }

      .hero img {
        width: 100%;
        height: 500px;
        object-fit: cover;
        display: block;
      }
    </style>
